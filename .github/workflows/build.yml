name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: Linux (GCC 14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-14 ninja-build \
            libx11-dev libxext-dev libxrandr-dev libxi-dev libxcursor-dev \
            libwayland-dev libxkbcommon-dev libdecor-0-dev \
            libgl-dev libegl-dev libpulse-dev libasound2-dev \
            libdbus-1-dev libudev-dev
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_C_COMPILER=gcc-14
                   -DCMAKE_BUILD_TYPE=RelWithDebInfo -DGAVAGA_WERROR=ON
      - name: Build
        run: cmake --build build -j
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure
      - name: Smoke test
        env:
          SDL_VIDEODRIVER: dummy
          SDL_RENDER_DRIVER: software
          SDL_AUDIODRIVER: dummy
        run: ./build/gavaga --play --debug --seed 1 --shot smoke.bmp --shot-at 5000

      # The capture -> rescue -> dual-fighter chain is the longest path in the
      # game and easy to break without noticing, so pin it with a fixed seed.
      - name: Tractor beam regression
        env:
          SDL_VIDEODRIVER: dummy
          SDL_RENDER_DRIVER: software
          SDL_AUDIODRIVER: dummy
        run: |
          ./build/gavaga --autoplay --godmode --stage 2 --seed 3 --trace \
                         --shot beam.bmp --shot-at 8000 2>&1 | tee trace.log
          for want in "mode play -> captured" "captive held: yes" \
                      "rescue ship: released" "dual fighter: DOCKED"; do
            grep -qF "$want" trace.log || { echo "MISSING: $want"; exit 1; }
          done
          echo "capture chain OK"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-frames
          path: |
            smoke.bmp
            beam.bmp
            trace.log

  windows:
    name: Windows x64 (MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      # No -G: the runner image changes which Visual Studio it ships, so let
      # CMake pick the newest installed one rather than naming a version.
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - name: Build
        run: cmake --build build --config RelWithDebInfo --parallel
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure -C RelWithDebInfo
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: build/**/gavaga.exe

  macos:
    name: macOS (Apple Silicon)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - name: Build
        run: cmake --build build -j3
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: build/gavaga
